name: Build

on:
  pull_request:
  push:
    branches:
      - 'main'

env:
  IMAGE: ghcr.io/giganticminecraft/seichi-gateway-operator

permissions: {}

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-24.04
    # 連続マージや古い run の再実行で run が並走し、古いコミットのビルドが後から完了しないよう
    # 直列化する。main では実行中の run はキャンセルしない (待機できる run はグループに 1 つだけで、
    # さらに新しい run が来ると待機中の方は cancel される)
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    permissions:
      contents: read
      packages: write
      # latest を付けるかの判定で run の一覧を読む
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # default branch のビルドで latest を付ける。ただし、この workflow の default branch 上の
      # 最新の run が別コミットのもの (古い run の再実行や、完了順の逆転) なら付けない。
      # 「branch の先頭コミットか」で判定すると、paths フィルタ等でこの workflow を起動しない
      # コミットが後に続いたとき latest が進まなくなるため、run の新しさで判定する
      - name: Decide whether to tag latest
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          enable=false
          if [ "${GITHUB_REF}" = "refs/heads/${DEFAULT_BRANCH}" ]; then
            workflow_file=${GITHUB_WORKFLOW_REF%@*}
            workflow_file=${workflow_file##*/}
            if ! newest_sha=$(gh run list -R "${GITHUB_REPOSITORY}" --workflow "${workflow_file}" \
                --branch "${DEFAULT_BRANCH}" --event push --limit 1 --json headSha --jq '.[0].headSha // ""') \
                || [ -z "${newest_sha}" ]; then
              # 判定できないときは巻き戻りを避けて latest を付けない (sha タグのビルドは止めない)。
              # latest は次の push で進む
              echo "::warning::この workflow の最新の run を取得できなかったため latest を付けない"
            elif [ "${newest_sha}" = "${GITHUB_SHA}" ]; then
              enable=true
            else
              echo "::notice::より新しいコミット (${newest_sha}) の run があるので latest を付けない"
            fi
          fi
          echo "enable=${enable}" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # latest は default branch のビルドでだけ付ける (条件は上の step)。seichi_infra のマニフェストは
          # latest@sha256:... で参照し、Renovate が digest の変化を追従する
          tags: |
            type=sha,prefix=sha-,suffix=,format=short
            type=raw,value=latest,enable=${{ steps.latest.outputs.enable }}

      - name: Build (and push if on main)
        uses: docker/build-push-action@v7
        with:
          context: .
          builder: ${{ steps.buildx.outputs.name }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # すべてのビルドステージのすべてのレイヤーをキャッシュして欲しいのでmode=max
          cache-to: type=gha,mode=max
