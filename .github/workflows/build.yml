name: Build

on:
  pull_request:
  push:
    branches:
      - 'main'

env:
  IMAGE: ghcr.io/giganticminecraft/seichi-gateway-operator

permissions: {}

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-24.04
    # 連続マージや古い run の再実行で run が並走し、古いコミットのビルドが後から完了しないよう
    # main では順に待たせる (cancel すると途中コミットの sha タグが push されなくなる)
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # default branch のビルドで latest を付ける。初回実行 (run_attempt 1) は concurrency で
      # push 順に直列化されているので常に付ける。先頭コミットだけに限ると、直後のコミットが
      # この workflow を起動しない (paths フィルタ等) とき latest が進まなくなるため。
      # 再実行 (run_attempt 2 以降) は古いコミットの run だと latest が巻き戻るので、
      # default branch の先頭コミットのときだけ付ける
      - name: Decide whether to tag latest
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          enable=false
          if [ "${GITHUB_REF}" = "refs/heads/${DEFAULT_BRANCH}" ]; then
            if [ "${GITHUB_RUN_ATTEMPT}" = 1 ]; then
              enable=true
            # API が失敗しても sha タグのビルドは止めず、latest だけ付けない
            elif ! head_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${DEFAULT_BRANCH}" --jq .sha); then
              echo "::warning::default branch の先頭コミットを取得できなかったため latest を付けない"
            elif [ "${head_sha}" = "${GITHUB_SHA}" ]; then
              enable=true
            else
              echo "::notice::default branch の先頭ではないコミットの再実行なので latest を付けない"
            fi
          fi
          echo "enable=${enable}" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # latest は default branch のビルドでだけ付ける (条件は上の step)。seichi_infra のマニフェストは
          # latest@sha256:... で参照し、Renovate が digest の変化を追従する
          tags: |
            type=sha,prefix=sha-,suffix=,format=short
            type=raw,value=latest,enable=${{ steps.latest.outputs.enable }}

      - name: Build (and push if on main)
        uses: docker/build-push-action@v7
        with:
          context: .
          builder: ${{ steps.buildx.outputs.name }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # すべてのビルドステージのすべてのレイヤーをキャッシュして欲しいのでmode=max
          cache-to: type=gha,mode=max
